<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
  <!-- Drawn for this project: an unbranded pair of red in-ear earbuds. Replaces the book's earbud.png, a HyperX product photo that cannot be published. -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a4f"/><stop offset="0.55" stop-color="#e3151d"/><stop offset="1" stop-color="#a80d12"/>
    </linearGradient>
    <radialGradient id="tip" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#8a8a8a"/><stop offset="1" stop-color="#3c3c3c"/>
    </radialGradient>
    <radialGradient id="cap" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0d0d0d"/>
    </radialGradient>
  </defs>
  <!-- cables -->
  <path d="M60 103 C 61 130, 61 160, 60 200" fill="none" stroke="#d8141b" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M100 69 C 99 105, 97 150, 94 200" fill="none" stroke="#d8141b" stroke-width="5" stroke-linecap="round"/>
  <!-- in-line remote with microphone -->
  <rect x="93" y="132" width="11" height="40" rx="5.5" fill="#1b1b1b" transform="rotate(9 98 152)"/>
  <rect x="95.6" y="146" width="5" height="10" rx="2.5" fill="#3a3a3a" transform="rotate(9 98 152)"/>
  <!-- back earbud (smaller) -->
  <g transform="translate(44 64) rotate(-8)">
    <path d="M6 18 C 10 30, 12 34, 10 42" fill="none" stroke="url(#red)" stroke-width="9" stroke-linecap="round"/>
    <path d="M14 -10 C 30 -12, 36 0, 34 10 C 32 20, 20 22, 14 18 Z" fill="url(#tip)"/>
    <rect x="-8" y="-12" width="26" height="30" rx="10" fill="url(#red)"/>
    <ellipse cx="-6" cy="3" rx="5" ry="13" fill="url(#cap)"/>
  </g>
  <!-- front earbud (larger) -->
  <g transform="translate(112 34) rotate(12)">
    <path d="M-4 -18 C 18 -30, 36 -14, 30 4 C 26 16, 10 18, 2 14 Z" fill="url(#tip)"/>
    <path d="M-2 14 C -2 26, -2 30, -4 38" fill="none" stroke="url(#red)" stroke-width="11" stroke-linecap="round"/>
    <rect x="-18" y="-16" width="32" height="34" rx="12" fill="url(#red)"/>
    <circle cx="-2" cy="1" r="13" fill="url(#cap)"/>
    <circle cx="-2" cy="1" r="13" fill="none" stroke="#e3151d" stroke-width="1.2" opacity="0.7"/>
    <rect x="-15" y="-3" width="2" height="6" rx="1" fill="#1b1b1b"/>
    <rect x="-11.5" y="-3" width="2" height="6" rx="1" fill="#1b1b1b"/>
  </g>
</svg>
